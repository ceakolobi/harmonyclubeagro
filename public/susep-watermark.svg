<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <style>
      .green-bg { fill: #00843D; }
      .yellow-bg { fill: #FFC700; }
      .white-band { fill: #FFFFFF; }
      .susep-green { fill: #00843D; }
      .susep-yellow { fill: #FFC700; }
      .susep-text { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 900; fill: #00843D; }
      .susep-subtext { font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-weight: 500; fill: #111111; }
    </style>
  </defs>

  <!-- Green Top-Left & Bottom-Left Sections -->
  <polygon points="0,0 520,0 0,520" class="green-bg" />
  <polygon points="0,200 520,720 0,720" class="green-bg" />

  <!-- Yellow Top-Right & Bottom-Right Sections -->
  <polygon points="760,0 1280,0 1280,520" class="yellow-bg" />
  <polygon points="1280,200 760,720 1280,720" class="yellow-bg" />

  <!-- White Crossing Diagonal Bands & Diamond Area -->
  <polygon points="0,0 1280,720 1280,720" class="white-band" opacity="0" />
  
  <!-- Diagonal White Stripe 1 (Top-Left to Bottom-Right) -->
  <polygon points="0,120 1160,720 1280,720 120,0 0,0" class="white-band" />
  
  <!-- Diagonal White Stripe 2 (Bottom-Left to Top-Right) -->
  <polygon points="0,600 1160,0 1280,0 120,720 0,720" class="white-band" />

  <!-- Central White Diamond -->
  <polygon points="640,240 880,360 640,480 400,360" class="white-band" />

  <!-- SUSEP Center Logo Group -->
  <g transform="translate(440, 275)">
    <!-- Cube Icon Pattern (Green and Yellow Cubes) -->
    <!-- Green Cubes -->
    <polygon points="30,25 45,15 60,25 45,35" class="susep-green" />
    <polygon points="30,25 45,35 45,50 30,40" fill="#006830" />
    <polygon points="45,35 60,25 60,40 45,50" fill="#009c48" />

    <polygon points="48,42 63,32 78,42 63,52" class="susep-green" />
    <polygon points="48,42 63,52 63,67 48,57" fill="#006830" />
    <polygon points="63,52 78,42 78,57 63,67" fill="#009c48" />

    <!-- Yellow Cubes -->
    <polygon points="12,42 27,32 42,42 27,52" class="susep-yellow" />
    <polygon points="12,42 27,52 27,67 12,57" fill="#e0b000" />
    <polygon points="27,52 42,42 42,57 27,67" fill="#ffe033" />

    <polygon points="30,59 45,49 60,59 45,69" class="susep-yellow" />
    <polygon points="30,59 45,69 45,84 30,74" fill="#e0b000" />
    <polygon points="45,69 60,59 60,74 45,84" fill="#ffe033" />

    <!-- SUSEP Typography -->
    <text x="95" y="62" class="susep-text" font-size="58" letter-spacing="1">SUSEP</text>
    <text x="96" y="82" class="susep-subtext" font-size="16" letter-spacing="0.2">Superintendência</text>
    <text x="96" y="100" class="susep-subtext" font-size="16" letter-spacing="0.2">de Seguros Privados</text>
  </g>
</svg>
